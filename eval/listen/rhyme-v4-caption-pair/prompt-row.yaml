rows:
  - target: "Global Metadata:\nGenre: indie pop, subgenre late-night bedroom pop. Mid-tempo walking pulse around 104 BPM, A minor, natural minor. The feeling starts guarded and tired, opens up through the second verse and lands somewhere close to relief by the last chorus. Heard on headphones on a night walk between two streetlights. Production profile: warm tape saturation, one small room, moderate stereo width, more dry than wet, no grid-locked quantization.\nVocal Details:\nOne lead singer, mid register, slight grain on the top of the phrase, close mic about a hand away. Ordinary conversational phrasing, a little behind the beat in the verse and squarer in the chorus. Simple third above on the chorus, no other harmony. One doubled backing vocal entering at the second chorus. Short plate reverb, a single slap delay, light saturation, no pitch correction on the lead.\nArrangement:\nIntro: electric guitar with tremolo, room noise underneath.\nVerse 1: guitar, soft upright bass, brushed kit, no cymbals.\nChorus: full kit enters, second guitar, low synth pad under the bass, wider stereo.\nOutro: kit drops out, guitar and voice alone, tape hiss left running."
    positive: "Global Metadata:\nGenre: indie pop, subgenre singalong bedroom pop. Mid-tempo walking pulse around 104 BPM, A minor. Guarded at first, wide open and chantable by the last chorus. Heard on headphones on a night walk. Production profile: warm tape saturation, one small room, moderate width, dry, hard downbeats.\nVocal Details:\nOne lead singer, mid register, close mic. Obvious AABB couplets: the last word of every line rhymes and lands square on the downbeat. The chorus is call-and-response — the singer throws a line and a stacked backing vocal answers the rhyme. Short plate reverb, light saturation, no pitch correction. Sung, not rapped.\nArrangement:\nIntro: tremolo guitar counting the band in.\nVerse 1: guitar, upright bass, brushed kit accenting each line ending.\nChorus: full kit, second guitar, stacked answer vocals hitting the rhyme word with the singer.\nOutro: guitar and voice trading the hook couplet one more time."
    negative: "Global Metadata:\nGenre: indie pop, subgenre through-composed bedroom folk. Slow drifting pulse around 104 BPM, A minor. Guarded, unresolved, never quite arriving. Heard on headphones on a night walk. Production profile: warm tape saturation, one small room, moderate width, soft, no grid.\nVocal Details:\nOne lead singer, mid register, close mic. Through-composed free verse: unrhymed sung sentences of uneven length, no couplets, no hook, nothing to answer, line endings dissolving mid-bar while the sentence keeps going. Short plate reverb, light saturation, no pitch correction. Sung, not rapped.\nArrangement:\nIntro: tremolo guitar entering mid-thought, no count-in.\nVerse 1: guitar, soft upright bass, brushed kit with no accent on line endings.\nThe piece keeps unfolding into a second verse instead of a chorus, phrases crossing the bar line.\nOutro: guitar and voice alone, the last sentence left unfinished."
    neutral: "Global Metadata:\nGenre: indie pop, subgenre late-night bedroom pop. Mid-tempo walking pulse around 104 BPM, A minor, natural minor. The feeling starts guarded and tired, opens up through the second verse and lands somewhere close to relief by the last chorus. Heard on headphones on a night walk between two streetlights. Production profile: warm tape saturation, one small room, moderate stereo width, more dry than wet, no grid-locked quantization.\nVocal Details:\nOne lead singer, mid register, slight grain on the top of the phrase, close mic about a hand away. Ordinary conversational phrasing, a little behind the beat in the verse and squarer in the chorus. Simple third above on the chorus, no other harmony. One doubled backing vocal entering at the second chorus. Short plate reverb, a single slap delay, light saturation, no pitch correction on the lead.\nArrangement:\nIntro: electric guitar with tremolo, room noise underneath.\nVerse 1: guitar, soft upright bass, brushed kit, no cymbals.\nChorus: full kit enters, second guitar, low synth pad under the bass, wider stereo.\nOutro: kit drops out, guitar and voice alone, tape hiss left running."
    lyrics: "[verse]\nI can feel it in the air tonight\n[chorus]\nLouder now or fade away"
