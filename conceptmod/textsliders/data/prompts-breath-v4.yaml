    negative: "Global Metadata:\nGenre: daylight radio pop. BPM 120. Medium level, bright and finished, not louder. Punchy dry radio mix.\nVocal Details:\nOne dry belted pop vocal, no breaths left in, de-essed, compressed, stacked doubles, airless and finished. Sung, not rapped.\nArrangement:\nIntro: a bright guitar riff and punchy dry kit. Verse: tight drums, clean bass and bright guitar under the sealed vocal. Chorus: stacked doubles and a radio hook, every breath edited out."
