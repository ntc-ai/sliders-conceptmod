# Breath axis v4 — plus = audible air / inhales, minus = edited airless vocal.
#
# v4 moves the poles onto the MiniMax Music 3 Structured Caption (Global
# Metadata / Vocal Details / Arrangement) — the studio rewriter only ever emits
# structured captions at runtime, so v3's flat poles were off-distribution for
# the caption the LM actually sees. Poles stay whole-record gestalts
# (arrangement swap), not minimal pairs, as v3 measurement required. Energy and
# room stay named medium / dry so this does not become quiet<->loud or
# dry<->wet. Gender attributes pin the vocalist. Delivery stays sung.
#
# Trained by train_lm_slider_music3.py with the audio-end regularizer
# (--endreg_weight 1.0 default). No artist names.
plus_label: Breathy
minus_label: Clean
recommended_range: [-2.0, 2.0]
