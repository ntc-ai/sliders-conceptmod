    positive: "Genre: hushed indie soul. BPM: 78. A breathy close-mic vocalist in a dry bedroom, loud inhales, lip noise, air hitting the capsule, unfinished takes, whispered consonants, you can hear them breathe. Felt-beater kick, warm bass, almost no cymbal. Medium level — intimate, not quiet, not a hall."
    negative: "Genre: daylight radio pop. BPM: 122. An airless belted pop vocal, breaths edited out, hard de-ess, radio compression, doubled and tuned, no mouth noise, a finished hit. Dry punchy kit, bright guitar. Medium level — polished, not louder, not wet."
