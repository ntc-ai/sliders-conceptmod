# Gender axis v4 — plus = female vocal, minus = male vocal.
#
# v4 moves the poles onto the MiniMax Music 3 Structured Caption (Global
# Metadata / Vocal Details / Arrangement) because the studio rewriter only ever
# emits structured captions at runtime — v3's flat captions were
# off-distribution for the caption the LM actually sees. Gender is the one
# documented exception to the divergent-poles rule (MUSIC3.md): "male"/"female"
# is lexically potent enough to carry a minimal pair, so only Vocal Details
# moves between poles and everything else stays pinned.
#
# Trained by train_lm_slider_music3.py with the audio-end regularizer
# (--endreg_weight 1.0 default). No artist names.
plus_label: Female
minus_label: Male
recommended_range: [-2.0, 2.0]
