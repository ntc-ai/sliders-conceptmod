# Breath axis: plus = audible air / inhales, minus = edited airless vocal.
# LM only encodes this as an opposing axis when poles are whole-record
# gestalts (arrangement swap), not minimal pairs. No artist names.
# Energy / room stay named as medium / dry so this does not become quiet↔loud
# or dry↔wet. Delivery stays sung.
# Gender attributes pin the vocalist on every row, as on live-v3 and rhyme-v3.
# The shipped breath-lm-v3 weights predate this pinning (trained rows=4; with
# pinning the file expands to 6) — the axis needs a retrain to pick it up.
plus_label: Breathy
minus_label: Clean
recommended_range: [-2.0, 2.0]
