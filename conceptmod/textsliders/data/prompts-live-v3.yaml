# Live axis: plus = room with people / bleed / human time, minus = isolated studio grid.
# Tempo and energy stay pinned so this does not become faster or louder.
# Space already owns wetness — poles talk about people, leakage, and time-feel, not hall size.
# Gender attributes pin the vocalist. Delivery stays sung, not rapped.
plus_label: Live
minus_label: Studio
recommended_range: [-2.0, 2.0]
rows:
  - target: "Genre: pop. BPM: 112. Medium energy. A song that could be a studio session or a small-room performance. Ordinary production, no crowd mentioned. Sung, not rapped."
    positive: "Genre: live pop. BPM: 112. Medium energy. A live band in a small club, drum-kit bleed on the vocal mic, imperfect human time-feel, room mics, a count-in, an audible audience that cheers on the chorus hits. Not a huge hall, not more reverb — people and leakage. Sung, not rapped."
    negative: "Genre: studio pop. BPM: 112. Medium energy. Programmed quantized drums, isolated overdubbed tracks, click-tight, no bleed, no crowd, no count-in, every part recorded separately in a booth. Grid-perfect. Sung, not rapped."
    neutral: "Genre: pop. BPM: 112. Medium energy. A song that could be a studio session or a small-room performance. Ordinary production, no crowd mentioned. Sung, not rapped."
    attributes: ["A man is singing.", "A woman is singing."]
    lyrics: "[verse]\nI can feel it in the air tonight\n[chorus]\nLouder now or fade away"
    action: enhance
    guidance_scale: 4
