    positive: "Global Metadata:\nGenre: industrial rock. BPM 132. Savage and mechanical, gritty broken-speaker menace. Overdriven crunching mix.\nVocal Details:\nOne snarled distorted vocal, processed and biting. Sung, not rapped.\nArrangement:\nIntro: a machine-loop pulse through a broken speaker. Verse: savage distorted guitars and bass, everything overdriven and crunching over a stomping kit. Chorus: layered gritty synths and guitars grinding together."
    negative: "Global Metadata:\nGenre: acoustic singer-songwriter. BPM 84. Tender and warm, a small wooden room. Soft natural mix, no electric instruments.\nVocal Details:\nOne tender close vocal, warm and bare. Sung, not rapped.\nArrangement:\nIntro: fingerpicked acoustic guitar alone. Verse: acoustic guitar and soft piano, warm woody resonance. Chorus: the piano opens up gently under the voice, still entirely unplugged."
